<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" width="1500" height="900" role="img" aria-label="Schematic cross section of the restored store showing passive strategies: cross ventilation through the existing side windows and open-backed shelving, warm air leaving by the high window, thick brick walls as thermal mass, the green roof shading the slab, daylight from both sides, and roof water running to a cistern and a rain garden">
